<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tutoriales</title>
  <style>
    body { max-width: 900px; margin: 32px auto; padding: 0 20px; font-family: Georgia, serif; color: #20332b; background: #f4f7f5; }
    h1 { font-size: 32px; }
    form { display: grid; gap: 12px; }
    label { display: grid; gap: 6px; }
    input, textarea, button { font: inherit; padding: 10px; }
    input, textarea { min-width: 0; border: 1px solid #71867a; background: white; }
    label.checkbox { display: flex; align-items: center; }
    button { cursor: pointer; border: 1px solid #345745; background: #fff; color: #20332b; }
    button:hover { background: #e1eee6; }
    button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid #b56718; outline-offset: 2px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0; }
    table { width: 100%; border-collapse: collapse; background: white; }
    th, td { padding: 12px 8px; text-align: left; border-bottom: 1px solid #ccd8d0; overflow-wrap: anywhere; }
    .table-wrap { overflow-x: auto; }
    #status { min-height: 24px; }
  </style>
</head>
<body>
  <h1>Tutoriales</h1>
  <form id="editor">
    <label>ID <input id="identifier" type="number" min="1" step="1"></label>
    <label>Titulo <input id="title" required maxlength="255"></label>
    <label>Descripcion <textarea id="description" rows="3"></textarea></label>
    <label class="checkbox"><input id="published" type="checkbox"> Publicado</label>
    <div><button type="submit">Crear</button></div>
  </form>
  <div class="actions">
    <button id="list" type="button">Listar</button>
    <button id="get" type="button">Consultar ID</button>
    <button id="update" type="button">Actualizar ID</button>
    <button id="delete" type="button">Eliminar ID</button>
  </div>
  <p id="status" role="status" aria-live="polite"></p>
  <div class="table-wrap">
    <table>
      <thead><tr><th>ID</th><th>Titulo</th><th>Descripcion</th><th>Publicado</th></tr></thead>
      <tbody id="results"></tbody>
    </table>
  </div>
  <script>
    const apiBase = '/api/tutorials';
    const field = name => document.getElementById(name);

    function render(records) {
      field('results').replaceChildren();
      for (const record of records) {
        const row = document.createElement('tr');
        for (const value of [record.id, record.title, record.description, record.published ? 'Si' : 'No']) {
          const cell = document.createElement('td');
          cell.textContent = value ?? '';
          row.append(cell);
        }
        field('results').append(row);
      }
      field('status').textContent = records.length ? records.length + ' registro(s)' : 'Sin registros';
    }

    async function request(method, path = '', body) {
      const response = await fetch(apiBase + path, {
        method,
        headers: body ? { 'Content-Type': 'application/json' } : {},
        body: body ? JSON.stringify(body) : undefined
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.message || 'HTTP ' + response.status);
      return data;
    }

    function selectedPath() {
      const identifier = Number(field('identifier').value);
      if (!Number.isInteger(identifier) || identifier < 1) throw new Error('Ingresar un ID valido');
      return '/' + identifier;
    }

    function payload() {
      if (!field('editor').reportValidity()) throw new Error('Revisar los campos');
      return { title: field('title').value, description: field('description').value, published: field('published').checked };
    }

    async function perform(action) {
      const buttons = document.querySelectorAll('button');
      buttons.forEach(button => { button.disabled = true; });
      field('status').textContent = 'Cargando...';
      try {
        await action();
      } catch (error) {
        field('status').textContent = error.message;
      } finally {
        buttons.forEach(button => { button.disabled = false; });
      }
    }

    const list = async () => render(await request('GET'));
    field('editor').onsubmit = event => {
      event.preventDefault();
      perform(async () => {
        const created = await request('POST', '', payload());
        field('identifier').value = created.id;
        await list();
      });
    };
    field('list').onclick = () => perform(list);
    field('get').onclick = () => perform(async () => {
      const record = await request('GET', selectedPath());
      field('title').value = record.title;
      field('description').value = record.description || '';
      field('published').checked = Boolean(record.published);
      render([record]);
    });
    field('update').onclick = () => perform(async () => {
      await request('PUT', selectedPath(), payload());
      await list();
    });
    field('delete').onclick = () => perform(async () => {
      const path = selectedPath();
      if (confirm('Eliminar el registro indicado?')) await request('DELETE', path);
      await list();
    });
    perform(list);
  </script>
</body>
</html>
